versao: "1.0"
idioma: pt-BR
descricao: Regras de classificacao de produtos de NF-e para Fantozzi

normalizacao:
  minusculas: true
  remover_acentos: true
  remover_pontuacao: true
  compactar_espacos: true

politica_de_match:
  em_caso_de_multiplos_matches: "registrar_alerta_CLASSIFICACAO_AMBIGUA"
  em_caso_de_zero_match: "registrar_alerta_NAO_CLASSIFICADO"
  observacao: >
    Aliases curtos (3 chars ou menos) so fazem match por palavra inteira.
    Em caso de ambiguidade, usa a regra de maior prioridade mas registra alerta.

# Regras por fornecedor (alta especificidade, executadas antes das regras gerais)
regras_por_fornecedor:
  - fornecedor_contem: "E SANTOS DE OLIVEIRA CARNES E DERIVADOS"
    produto_normalizado_contem: "kilos"
    conta_id: "2.02.001"
    conta_nome: "Carnes Bovinas"
    observacao: "Fornecedor usa descricao generica KILOS para carnes bovinas."

