[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantozzi"
version = "0.1.0"
description = "Agente Fantozzi - Registro contábil de NF-e para restaurante"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
fantozzi = "fantozzi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
