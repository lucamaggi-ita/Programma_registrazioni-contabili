# Fantozzi — Proposta inicial de regras de classificação contábil
# Idioma: português do Brasil
# Origem: análise preliminar dos XML NF-e recebidos em dois arquivos ZIP enviados pelo usuário.
# ATENÇÃO: este arquivo é uma primeira base. Deve ser revisado antes de virar regra definitiva.

versao: "0.2-proposta"
idioma: "pt-BR"

normalizacao:
  minusculas: true
  remover_acentos: true
  remover_pontuacao: true
  compactar_espacos: true
  html_unescape: true

politica_de_match:
  regra_padrao: "contem_frase_normalizada"
  aliases_curtos: "somente_palavra_inteira"
  tamanho_minimo_alias_parcial: 4
  em_caso_de_multiplos_matches: "registrar_alerta_CLASSIFICACAO_AMBIGUA"
  em_caso_de_zero_match: "registrar_alerta_NAO_CLASSIFICADO"
  observacoes:
    - "Evitar aliases genéricos demais, como 'sch', 'sol', 'doc' ou 'gin' sem fronteira de palavra."
    - "Usar prioridade apenas para sugerir uma conta; nunca esconder alertas de ambiguidade."
    - "Produtos genéricos como 'KILOS' exigem regra por fornecedor ou revisão manual."

regras_por_fornecedor:
  - fornecedor_contem: "E SANTOS DE OLIVEIRA CARNES E DERIVADOS"
    produto_exato_normalizado: "kilos"
    conta_economica: "Carnes Bovinas"
    observacao: "O fornecedor usa descrição genérica 'KILOS' para carnes; revisar periodicamente."

